<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Webring</title>
    <link rel="stylesheet" href="/static/public.css">
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css">
</head>
<body>
<header>
    <h1>
        <i class="ri-bubble-chart-fill"></i>
        Login to Webring
    </h1>
</header>
<main>
    <div style="text-align: center; margin: 2rem 0;">
        <p>Login with your Telegram account to Manage your websites in the webring.</p>

        <form method="post" action="/auth/telegram/start">
            {{csrfField .}}
            <button type="submit" class="action-card action-card-primary" style="display: inline-flex">
                <i class="ri-telegram-fill" aria-hidden="true"></i> Log in with Telegram
            </button>
        </form>

        <p style="margin-top: 2rem; color: var(--color-gray-400);">
            <a href="/">← Back to site listing</a>
        </p>
    </div>
</main>
</body>
</html>
