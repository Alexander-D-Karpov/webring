version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - webring

linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    goconst:
      min-len: 3
      min-occurrences: 10

    gocritic:
      enabled-tags: [diagnostic, experimental, opinionated, performance, style]

    gosec:
      # gosec's taint-analysis rules were added after this project's last green build and
      # turned CI red without a line of code changing. Here they trace back to
      # operator-supplied environment variables and to values the service itself just
      # fetched, and they misfire outright: G706 flags logging the *length* of the CSRF
      # key, an int that cannot carry a newline. Drop the rules rather than paper over
      # every call site with nolint comments.
      excludes:
        - G703 # path traversal: the only sources are MEDIA_FOLDER and LOG_FILE_PATH
        - G704 # SSRF: the Telegram API host is a constant
        - G706 # log injection: env values, and false positives on non-string arguments

    govet:
      enable: [shadow]
      disable: [fieldalignment]

    lll:
      line-length: 120

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    unparam:
      check-exported: false
